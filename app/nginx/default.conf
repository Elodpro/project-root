# Configuration HTTP (Redirection vers HTTPS)
server {
    listen 80;
    server_name _;

    # Redirection stricte vers HTTPS (Bonne pratique de sécurité)
    return 301 https://$host$request_uri;
}

# Configuration HTTPS (Le Reverse Proxy principal)
server {
    listen 443 ssl; # Écoute sur le port sécurisé 443
    server_name _;

    # --- Configuration SSL/TLS (Doit être adaptée) ---
    # Pour un environnement de développement, vous pouvez utiliser des certificats auto-signés.
    # Pour la production, intégrez Let's Encrypt ou utilisez un certificat réel.
    # Dans un environnement conteneurisé, les chemins doivent pointer vers les volumes montés.
    ssl_certificate /etc/nginx/conf.d/ssl/cert.pem; 
    ssl_certificate_key /etc/nginx/conf.d/ssl/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Headers de sécurité
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        # Proxy vers le service 'wordpress' tel que défini dans docker-compose.yml
        proxy_pass http://wordpress:80; 

        # En-têtes essentiels pour un reverse proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # Informe Wordpress qu'il est sous HTTPS
        
        # Gestion des grands fichiers
        client_max_body_size 50M;
    }
}