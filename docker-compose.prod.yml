version: '3.8'

# 1. Services de l'application (Identiques ou améliorés par rapport au docker-compose.yml)
services:
  db:
    # Référence l'image MySQL
    image: mysql:8.0
    container_name: mysql-db-prod
    restart: always
    environment:
      # Utilise le .env
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      # VOLUME PERSISTANT pour les données de production
      - db_data_prod:/var/lib/mysql
    networks:
      - prod-network

  wordpress:
    # Utilise l'image construite à partir du Dockerfile personnalisé [cite: 21]
    build:
      context: ./docker/wordpress
    container_name: wordpress-app-prod
    restart: always
    environment:
      # Configuration de la connexion à la base de données
      WORDPRESS_DB_HOST: db:3306
      # ... autres variables ...
    volumes:
      # VOLUME PERSISTANT pour le contenu (thèmes, plugins) [cite: 40, 41, 42]
      - wp_content_prod:/var/www/html/wp-content
    depends_on:
      - db
    networks:
      - prod-network

  nginx:
    # Nginx en tant que reverse proxy avec HTTPS [cite: 11, 27]
    image: nginx:latest
    container_name: nginx-proxy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # Montage des certificats SSL (non inclus dans cet exemple, mais nécessaire)
    depends_on:
      - wordpress
    networks:
      - prod-network

  # 2. Services de Monitoring (Ajoutés pour la production)
  
  # Prometheus pour la collecte de métriques
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090" # Port d'accès à l'interface de Prometheus
    volumes:
      # Montage du fichier de configuration [cite: 60]
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      # Volume pour la persistance des données de métriques
      - prometheus_data:/prometheus
    command: 
      # Commande pour démarrer Prometheus avec la config spécifiée
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - prod-network

  # Grafana pour la visualisation des métriques
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000" # Port d'accès à l'interface de Grafana
    volumes:
      # Configuration des sources de données [cite: 62, 63]
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      # Configuration des tableaux de bord [cite: 64, 66]
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      # Volume pour la persistance des données de Grafana
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus # Grafana dépend de Prometheus pour les données
    networks:
      - prod-network

# 3. Définition des Volumes et Réseaux de Production
volumes:
  # Volumes spécifiques à la production pour la persistance
  db_data_prod:
  wp_content_prod:
  prometheus_data:
  grafana_data:

networks:
  prod-network:
    driver: bridge